<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Lily Bouquet</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: monospace;
            font-size: 8px;
            line-height: 6px;
            letter-spacing: 1px;
            white-space: pre;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        #upload-container {
            margin-bottom: 20px;
            font-family: sans-serif;
            font-size: 14px;
        }
        #ascii-art {
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="upload-container">
        <label>Select a flower image from your PC: </label>
        <input type="file" id="image-loader" accept="image/*">
    </div>
    <div id="ascii-art"></div>

    <script src="script.js"></script>
</body>
</html>
